# Production versions: minimap2 2.31, miniprot 0.18-r281, MAFFT 7.5+. Node (with the `docx` package) is needed only for the supplementary Word files.
name: telotrons
channels: [conda-forge, bioconda, nodefaults]
dependencies:
  - python=3.12
  - numpy>=1.26
  - pandas>=2
  - scipy>=1.10
  - matplotlib>=3.7
  - biopython>=1.85
  - openpyxl
  - minimap2=2.31
  - miniprot=0.18
  - mafft>=7.5
  - samtools>=1.17
  - blast>=2.13
  - sra-tools>=3.0
