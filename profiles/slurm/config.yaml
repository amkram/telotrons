# Snakemake --profile config for a slurm HPC.
#
# ALWAYS INVOKE VIA slurm/submit.sh — the $SLURM_PARTITION/$SLURM_ACCOUNT
# placeholders below are literal strings; submit.sh sed-substitutes them
# from env at run time. Calling `snakemake --profile profiles/slurm` directly
# will submit `sbatch --partition=$SLURM_PARTITION`, which fails.
#
# Usage:
#   ./slurm/submit.sh <target> [-- <extra snakemake args>]   # recommended
# Site-specific bits (partition, account, mail) live in slurm/site.sh.

# Wall-clock scheduling limits from the outer snakemake invocation.
cores: 512
jobs: 96                    # max concurrent slurm jobs snakemake will submit
latency-wait: 90            # seconds to wait for NFS metadata after job completion
keep-going: true            # don't halt the whole DAG on one rule failure
rerun-incomplete: true
use-conda: false            # tools come from a preloaded env module (see slurm/site.sh)
restart-times: 2            # auto-retry transient sbatch failures (2 retries)
printshellcmds: true
show-failed-logs: true

# Submit each rule as its own sbatch job. Per-rule resources come from the
# rule's `threads:` / `resources:` block; defaults below apply when a rule
# doesn't override.
default-resources:
  mem_mb: 4000
  runtime: 240              # minutes
  slurm_partition: "$SLURM_PARTITION"    # replaced from env at submit time
  slurm_account: "$SLURM_ACCOUNT"

# Classic v6 cluster template. --job-name embeds the rule + wildcards so
# squeue output is readable; -o/-e route logs into work/logs/slurm/.
cluster: >-
  sbatch
  --parsable
  --job-name=telo.{rule}.{wildcards}
  --partition={resources.slurm_partition}
  --account={resources.slurm_account}
  --cpus-per-task={threads}
  --mem={resources.mem_mb}M
  --time={resources.runtime}
  --output=work/logs/slurm/{rule}.{jobid}.out
  --error=work/logs/slurm/{rule}.{jobid}.err
cluster-status: profiles/slurm/status.py
cluster-cancel: scancel

# Snakemake respects these when a rule declares them; unset falls back to
# default-resources above. The concrete numbers here are tuned to the
# telotron pipeline profile — see `scripts/*.py` runtime budgets.
# NB after the 2026-07-16 slurm refactor: scan_all and telotron_orthologs are
# CHEAP AGGREGATORS. The real workers are scan_one_genome (one sbatch per
# genome, ~11k jobs on a full run) and telotron_orthologs_one (one per
# confident bearer). Resource overrides MUST target the workers or the
# vertebrate-scale shards silently OOM at the 4 GB default.
set-threads:
  scan_one_genome: 4
  telotron_orthologs_one: 8
  dedup_telotrons: 16
  find_tert: 16
  linker_analysis: 8
  nucleosome_analysis: 8

set-resources:
  scan_one_genome:
    mem_mb: 16000             # vertebrate + polyploid plant genomes need headroom
    runtime: 240
  scan_all:                   # aggregator: cheap concat on the driver
    mem_mb: 4000
    runtime: 30
  telotron_orthologs_one:
    mem_mb: 32000
    runtime: 480
  telotron_orthologs:         # aggregator: cp + plot only
    mem_mb: 4000
    runtime: 30
  dedup_telotrons:
    mem_mb: 32000
    runtime: 180
  find_tert:
    mem_mb: 32000
    runtime: 240
  find_interstitial_arrays:
    mem_mb: 16000
    runtime: 240
  filter_final:
    mem_mb: 32000             # loads all_introns_scanned.tsv (~4 GB)
    runtime: 60
  linker_analysis:
    mem_mb: 8000
    runtime: 120
  mask_telotron_arrays:
    mem_mb: 8000
    runtime: 60
  nucleosome_analysis:
    mem_mb: 32000
    runtime: 240
  telotron_gene_class:
    mem_mb: 16000
    runtime: 60
  length_distribution_by_arch:
    mem_mb: 8000
    runtime: 30
  rnaseq_gene_coverage:
    mem_mb: 32000             # sra download + minimap alignment
    runtime: 720
  telotron_expr_figures:
    mem_mb: 8000
    runtime: 30
  manifests:
    mem_mb: 4000
    runtime: 30
  download_assemblies:
    mem_mb: 4000
    runtime: 720              # ~10 h for a full RefSeq+GenBank pull
  tara_archives:
    mem_mb: 4000
    runtime: 240
